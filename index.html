async function initTracking(){

 x.fillText('TRƯỜNG THPT PHÚ NHUẬN',w/2,24);x.fillStyle=c;x.font='bold 17px sans-serif';x.fillText('ĐỀ KIỂM TRA MÔN '+n.toUpperCase(),w/2,50);
 x.fillStyle='#444';x.textAlign='left';x.font='12px sans-serif';for(let q=1;q<=7;q++){x.fillText('Câu '+q+'. ........................................',16,60+q*34);x.fillStyle='#bbb';x.fillRect(16,70+q*34,200-q*6,3);x.fillStyle='#444'}
 x.fillStyle='#e11';x.font='italic bold 34px cursive';x.fillText(ri(5,10)+','+ri(0,9),170,325)}
function drawPic(x,i){const E=['🧑‍🎓','👩‍🏫','👨‍💻','👩‍🔬','🧑‍🚀','🧑‍🎤','👨‍🍳','🧑‍🎨'];rr(x,'#222',256,300);x.fillStyle=SUBJ[i%8][1];x.fillRect(10,10,236,280);
 x.font='140px serif';x.textAlign='center';x.fillText(E[i%8],128,190)}
function tear(x,w,h){x.globalCompositeOperation='destination-out';x.beginPath();x.moveTo(0,0);let px=w*rnd(.35,.6);for(let t=0;t<=8;t++)x.lineTo(px*(1-t/8)+(t%2?12:-4),h*.5*t/8);x.lineTo(0,h*.5);x.fill();
 x.beginPath();x.moveTo(w,h);x.lineTo(w*.55,h);for(let t=0;t<=8;t++)x.lineTo(w*(.55+.45*t/8)+(t%2?-10:6),h*(1-.4*t/8));x.fill();
 x.globalCompositeOperation='source-atop';x.strokeStyle='rgba(120,30,20,.7)';x.lineWidth=5;for(let t=0;t<6;t++){x.beginPath();x.moveTo(rnd(0,w),rnd(0,h));x.lineTo(rnd(0,w),rnd(0,h));x.stroke()}
 x.fillStyle='rgba(90,40,10,.28)';x.fillRect(0,0,w,h);x.globalCompositeOperation='source-over'}
const cache={};
function getTex(kind,i,torn){const key=kind+i+torn;if(cache[key])return cache[key];
 const c=document.createElement('canvas'),w=256,h=kind==='book'?340:kind==='paper'?352:300;c.width=w;c.height=h;const x=c.getContext('2d'),t=new THREE.CanvasTexture(c);
 const D={book:drawBook,paper:drawPaper,pic:drawPic}[kind],urls={book:BOOK_IMAGES,paper:PAPER_IMAGES,pic:PEOPLE_IMAGES}[kind];
 const fin=()=>{if(torn)tear(x,w,h);t.needsUpdate=true};
 if(urls.length){D(x,i);const im=new Image();im.onload=()=>{x.clearRect(0,0,w,h);x.drawImage(im,0,0,w,h);fin()};im.src=urls[i%urls.length]}else{D(x,i)}
 fin();return cache[key]=t}

/* ===== Âm nhạc điện tử (WebAudio): kick, snare, hat, bass, arp, hook ===== */
const mk=(bpm,w,v,prog,hookA,hookB,k,sn,h)=>({bpm,w,v,prog,hook:[hookA,hookB],k,sn,h});
const TH={
 menu:mk(150,'square',.05,[[57,3],[52,4],[57,3],[52,4]],[76,0,71,72,74,0,72,71,69,0,69,72,76,0,74,72],[71,0,0,72,74,0,76,0,72,0,69,0,69,0,0,0],'x...x...x...x...','....x.......x...','..x...x...x...x.'),
 easy:mk(128,'square',.05,[[60,4],[65,4],[67,4],[60,4]],[79,0,84,0,86,0,84,0,81,0,79,0,81,84,0,0],[79,0,84,0,86,0,88,0,86,0,84,0,86,0,0,0],'x...x...x...x...','....x.......x...','..x...x...x...x.'),
 medium:mk(140,'sawtooth',.035,[[57,3],[53,4],[60,4],[55,4]],[76,0,76,79,0,76,0,74,72,0,72,74,0,72,0,0],[76,0,79,0,81,0,79,76,74,0,72,0,74,0,0,0],'x...x...x...x..x','....x.......x...','x.x.x.x.x.x.x.x.'),
 hard:mk(172,'sawtooth',.035,[[52,3],[48,4],[55,4],[50,4]],[76,76,0,79,76,0,83,0,81,0,79,0,76,0,74,0],[76,76,0,79,76,0,86,0,84,0,83,0,79,0,81,0],'x...x..xx...x...','....x.......x..x','xxxxxxxxxxxxxxxx'),
 secret:mk(120,'triangle',.11,[[50,3],[46,4],[53,4],[57,4]],[74,0,0,77,0,74,0,72,70,0,0,72,0,0,0,0],[74,0,0,77,0,81,0,79,77,0,74,0,72,0,0,0],'x..x..x...x..x..','....x.......x...','..x...x...x...x.')};
let ac,OUT,mt,nt=0,st=0;
function note(m,t,d,w,v){const o=ac.createOscillator(),g=ac.createGain();o.type=w;o.frequency.value=440*2**((m-69)/12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(OUT);o.start(t);o.stop(t+d)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g).connect(OUT);o.start(t);o.stop(t+.22)}
function nz(t,d,f,v){const n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
 const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;fl.type='highpass';fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl).connect(g).connect(OUT);s.start(t)}
function step(th,i,t,d){const s=i%16,bar=(i>>4)%4,[r,q]=th.prog[bar];
 if(th.k[s]==='x')kick(t);if(th.sn[s]==='x')nz(t,.16,1400,.2);if(th.h[s]==='x')nz(t,.04,7500,s%4===2?.07:.04);
 if(s%2===0)note(r-24+(s%4===2?12:0),t,d*1.8,'square',.1);
 const ar=[0,q,7,12,7,q,0,7,12,q+12,12,7,q,7,0,7][s];note(r+12+ar,t,d*.9,th.w,th.v);
 const hk=th.hook[bar&1][s];if(hk)note(hk,t,d*1.6,'square',th.v*1.5)}
function music(n){clearInterval(mt);mt=null;if(!n||!ac)return;const th=TH[n],d=15/th.bpm;st=0;nt=ac.currentTime+.1;
 mt=setInterval(()=>{
  const now=ac.currentTime;
  if(nt<now){const skipped=Math.ceil((now-nt)/d);st+=skipped;nt+=skipped*d}
  while(nt<now+.15){step(th,st,nt,d);nt+=d;st++}
 },30)}
const sfx=(m,w='sine',d=.15,v=.15)=>ac&&note(m,ac.currentTime,d,w,v);
function audioOn(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();OUT=ac.createGain();OUT.gain.value=.8;OUT.connect(ac.destination)}ac.resume()}

/* ===== Game ===== */
const COUNTDOWN=2;
const GEOMETRIES={
 book:new THREE.BoxGeometry(.9,1.2,.16),
 paper:new THREE.PlaneGeometry(.95,1.3),
 pic:new THREE.PlaneGeometry(.95,1.08)
};
let cd=0,state='menu',lvKey='easy',cfg,g=0,objs=[],queue=[],score=0,lives=0,hit=0,targetCount=0,last=null;
function removeObject(index){
 const [object]=objs.splice(index,1);
 S.remove(object.m);
 object.mats.forEach(material=>material.dispose());
}
function start(k){audioOn();lvKey=k;cfg=LV[k];state='play';
 resetSabers();
 const N=ri(...cfg.n),Tn=ri(...cfg.torn),types=[];targetCount=N-Tn;
 for(let i=0;i<N;i++)types.push(i<Tn);
 for(let i=N-1;i>0;i--){const j=ri(0,i);[types[i],types[j]]=[types[j],types[i]]}
 const t0=1.5,span=cfg.dur-t0-cfg.T[1];queue=types.map((tr,i)=>({at:t0+span*(i+Math.random()*.9)/N,torn:tr}));
 score=0;lives=cfg.lives;hit=0;cd=0;g=-COUNTDOWN;last=performance.now();
 ['menu','end'].forEach(i=>$(i).classList.remove('on'));$('hud').style.display='flex';music(cfg.th);scheduleFrame()}
function spawn(q){const kind=lvKey==='secret'?'pic':Math.random()<.5?'book':'paper',i=ri(0,7),tex=getTex(kind,i,q.torn),tint=q.torn?0xffb0a0:0xffffff;
 const side=Math.random()<.5?-1:1;let m;
 let mats;
 if(kind==='book'){const s=new THREE.MeshBasicMaterial({color:q.torn?0x6b3a30:0xf2f2f2,transparent:true}),f=new THREE.MeshBasicMaterial({map:tex,color:tint,transparent:true});m=new THREE.Mesh(GEOMETRIES.book,[s,s,s,s,f,s]);mats=[s,f]}
 else{const material=new THREE.MeshBasicMaterial({map:tex,color:tint,transparent:true,alphaTest:.05,side:THREE.DoubleSide});m=new THREE.Mesh(GEOMETRIES[kind],material);mats=[material]}
 const a=new THREE.Vector3(side*rnd(1.5,5),rnd(7,11),-22),b=new THREE.Vector3(side*rnd(.15,Math.max(.2,Math.tan(.5236)*2.8*C.aspect-.95)),rnd(-.5,.4),-2.8);
 m.position.copy(a);S.add(m);mats.forEach(material=>material.opacity=.45);
 objs.push({m,mats,a,b,kind,torn:q.torn,sp:q.at,T:rnd(...cfg.T),ph:rnd(0,6)})}
function pop(x,y,txt,sub,col,cls){const d=document.createElement('div');d.className='pop '+(cls||'');d.style.left=x+'px';d.style.top=y+'px';d.style.color=col;d.innerHTML=txt+(sub?'<small style="color:'+col+'">'+sub+'</small>':'');document.body.appendChild(d);setTimeout(()=>d.remove(),900)}
const MAX_PARTICLES=150,particles=[];
const particleGeometry=new THREE.BufferGeometry();
const particlePositions=new THREE.BufferAttribute(new Float32Array(MAX_PARTICLES*3),3).setUsage(THREE.DynamicDrawUsage);
const particleColors=new THREE.BufferAttribute(new Float32Array(MAX_PARTICLES*3),3).setUsage(THREE.DynamicDrawUsage);
particleGeometry.setAttribute('position',particlePositions);
particleGeometry.setAttribute('color',particleColors);
const particleCanvas=document.createElement('canvas');
particleCanvas.width=particleCanvas.height=32;
const particleContext=particleCanvas.getContext('2d');
const particleGradient=particleContext.createRadialGradient(16,16,0,16,16,16);
particleGradient.addColorStop(0,'#fff');particleGradient.addColorStop(1,'#fff0');
particleContext.fillStyle=particleGradient;particleContext.fillRect(0,0,32,32);
const particleCloud=new THREE.Points(particleGeometry,new THREE.PointsMaterial({
 size:.05,map:new THREE.CanvasTexture(particleCanvas),vertexColors:true,
 transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
}));
particleCloud.frustumCulled=false;particleCloud.visible=false;S.add(particleCloud);
function burst(position,color,count,speed=2){
 const tint=new THREE.Color(color);
 for(let i=0;i<count&&particles.length<MAX_PARTICLES;i++){
  const force=speed*rnd(.4,1);
  particles.push({x:position.x,y:position.y,z:position.z,
   vx:rnd(-1,1)*force,vy:rnd(-1,1)*force,vz:rnd(-1,1)*force,life:1,tint});
 }
}
function updateParticles(dt){
 let count=0;
 for(const p of particles){
  p.life-=dt*1.4;
  if(p.life<=0)continue;
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
  particlePositions.setXYZ(count,p.x,p.y,p.z);
  particleColors.setXYZ(count,p.tint.r*p.life,p.tint.g*p.life,p.tint.b*p.life);
  particles[count++]=p;
 }
 particles.length=count;particleCloud.visible=count>0;
 particleGeometry.setDrawRange(0,count);
 if(count){particlePositions.needsUpdate=true;particleColors.needsUpdate=true}
}
function loseLife(){lives--;const f=$('flash');f.style.transition='none';f.style.opacity=.45;requestAnimationFrame(()=>{f.style.transition='opacity .4s';f.style.opacity=0});if(lives<=0)finish(false)}
function finish(win){if(state!=='play')return;state='end';music(null);
 while(objs.length)removeObject(objs.length-1);
 particles.length=0;particleCloud.visible=false;resetSabers();
 $('hud').style.display='none';$('msg').textContent='';
 $('et').textContent=win?'CHIẾN THẮNG! 🎉':'GAME OVER';
 $('es').innerHTML='Điểm: <b>'+score+'</b><br>Độ chính xác: <b>'+Math.round(hit/Math.max(1,targetCount)*100)+'%</b>';$('end').classList.add('on');
 if(win)sfx(88,'square',.5)}

const projected=new THREE.Vector3(),screenPoint=new THREE.Vector2();
const gameMessage=$('msg'),hudScore=$('hs'),hudTime=$('ht'),hudLives=$('hl');
function setText(element,value){if(element.textContent!==value)element.textContent=value}
function updateRound(elapsed){
 g+=elapsed;cd-=elapsed;
 setText(gameMessage,g<0?(g<-1?'SẴN SÀNG…':'BẮT ĐẦU!'):'');
 while(queue.length&&queue[0].at<=g)spawn(queue.shift());
 const canSlice=cd<=0&&sabers.some(s=>s.on&&s.trail.length>1);
 let candidate=null;
 for(let i=0;i<objs.length;i++){
  const o=objs[i],u=(g-o.sp)/o.T;
  if(u>=1){
   removeObject(i--);
   if(!o.torn){
    pop(W/2,H*.62,'MISS','−1 ❤','#ff4d4d');sfx(120,'sawtooth',.3);loseLife();
    if(state!=='play')return;
   }
   continue;
  }
  o.m.position.lerpVectors(o.a,o.b,u);
  o.m.position.y=o.a.y+(o.b.y-o.a.y)*u**1.8;
  o.m.rotation.set(Math.sin(g*2+o.ph)*.3,Math.sin(g*1.5+o.ph)*.5,Math.sin(g*3+o.ph)*.4);
  const remaining=o.T*(1-u),inRange=remaining<=REACH;
  if(inRange!==o.inr){o.inr=inRange;o.mats.forEach(material=>material.opacity=inRange?1:.45)}
  if(!inRange||!canSlice||(candidate&&u<=candidate.progress))continue;
  projected.copy(o.m.position).project(C);
  screenPoint.set((projected.x+1)/2*W,(1-projected.y)/2*H);
  const radius=.6*(H/2)/(Math.tan(C.fov*Math.PI/360)*-o.m.position.z)+14;
  if(sabers.some(s=>hitTrail(s,screenPoint,radius)))candidate={object:o,progress:u,x:screenPoint.x,y:screenPoint.y,remaining};
 }
 if(candidate){
  const {object:o,x,y,remaining}=candidate;
  cd=.25;removeObject(objs.indexOf(o));
  if(o.torn){
   score+=PEN[o.kind];burst(o.m.position,0xff5522,70,3.5);sfx(60,'sawtooth',.5,.3);
   pop(x,y,'💥 '+PEN[o.kind],'−1 ❤','#ff6b3d');loseLife();
   if(state!=='play')return;
  }else{
   const i=remaining<=.6?0:remaining<=1?1:remaining<=1.5?2:3,p=PTS[o.kind][i];
   score+=p;hit++;
   burst(o.m.position,RT[i][1],26);sfx(72-i*3+ri(0,4)*2,'square',.12);
   pop(x,y,RT[i][0],'+'+p+' · còn '+remaining.toFixed(1)+'s',RT[i][1],RT[i][2]);
  }
 }
 setText(hudScore,'Điểm '+score);
 setText(hudTime,Math.min(cfg.dur,Math.max(0,Math.ceil(cfg.dur-g)))+'s');
 setText(hudLives,'❤'.repeat(Math.max(0,Math.min(lives,12)))+(lives>12?' ×'+lives:''));
 if(g>=cfg.dur)finish(true);
}
function frame(now){
 frameId=0;
 if(document.hidden)return;
 if(state==='play'){
  const elapsed=last===null?0:Math.max(0,(now-last)/1000),dt=Math.min(.05,elapsed);last=now;
  try{trackHands(now)}catch(error){useMouse(error)}
  updateSabers(dt,now);
  updateRound(elapsed);
  updateParticles(dt);
  if(state==='play')scheduleFrame();
 }
 R.render(S,C);
}
document.addEventListener('visibilitychange',()=>{
 last=null;
 if(document.hidden)resetSabers();else scheduleFrame();
});

document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>start(b.dataset.lv));
$('retry').onclick=()=>start(lvKey);
$('home').onclick=()=>{state='menu';$('end').classList.remove('on');$('menu').classList.add('on');audioOn();music('menu')};
addEventListener('pointerdown',()=>{audioOn();if(state==='menu'&&!mt)music('menu')},{once:false});
let buf='';addEventListener('keydown',e=>{if(state!=='menu'||e.key.length!==1)return;audioOn();buf=(buf+e.key.toLowerCase()).slice(-8);
 if(buf.length===8&&btoa(buf)===SECRET_B64){$('secret').style.display='block';sfx(84,'square',.4)}});
$('ppl').onchange=e=>{PEOPLE_IMAGES=[...e.target.files].map(f=>URL.createObjectURL(f));Object.keys(cache).filter(k=>k.startsWith('pic')).forEach(k=>delete cache[k])};
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
